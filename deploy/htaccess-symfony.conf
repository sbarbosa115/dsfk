# >>> dsfk front controller >>> (managed by deploy/cpanel-update.sh — edit above or below this block, not inside)
# Sends every URL that is not a real file to backend/public/index.php, which is what makes /projects, /audit and
# /projects/{id} work. cPanel's own lines (the PHP handler) stay wherever they are in this file. The local Docker
# stack includes this same file in its vhost, so both serve the app the same way.
DirectoryIndex index.php

<IfModule mod_negotiation.c>
    # MultiViews would answer /projects with a file it guessed instead of letting Symfony route it.
    Options -MultiViews
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Force HTTPS once the domain has a certificate (cPanel AutoSSL): uncomment the next two lines.
    # RewriteCond %{HTTPS} !=on
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    # /index.php/foo → /foo, so one URL is not reachable under two spellings.
    RewriteCond %{ENV:REDIRECT_STATUS} =""
    RewriteRule ^index\.php(?:/(.*)|$) /$1 [R=301,L]

    # A real file (the UI build, the favicon) is served as it is.
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]

    RewriteRule ^ index.php [L]
</IfModule>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # After HTTPS works everywhere, uncomment to make browsers always use it:
    # Header always set Strict-Transport-Security "max-age=31536000"

    # The production build has content hashes in its file names: cache them for a year.
    <If "%{REQUEST_URI} =~ m#^/build/.+\.[0-9a-f]{8}\.#">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>
</IfModule>

# Never serve dotfiles (.htaccess.before-dsfk, .user.ini…).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
# <<< dsfk front controller <<<
