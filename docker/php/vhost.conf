<VirtualHost *:80>
    DocumentRoot /var/www/backend/public
    <Directory /var/www/backend/public>
        AllowOverride All
        Require all granted
        # The same front-controller rules cPanel gets appended to its .htaccess (deploy/htaccess-symfony.conf).
        Include /etc/apache2/dsfk-front-controller.conf
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
