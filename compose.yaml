services:
  php:
    build:
      context: ./docker/php
      # www-data takes the host user's ids, so files written in the bind mount (vendor/, var/) stay the host's and
      # the mount is writable wherever the checkout is (a laptop, CI). The Makefile and the CI workflow set them.
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    ports:
      - "${APP_PORT:-18081}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./deploy/htaccess-symfony.conf:/etc/apache2/dsfk-front-controller.conf:ro
    environment:
      DATABASE_URL: "mysql://app:app@mysql:3306/app?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
      # Upload folders readable by the node service's tools (Prettier walks the project); production keeps 0750.
      UPLOAD_DIR_MODE: "0755"
      # Links in the emails point at this checkout's app.
      APP_URL: "http://localhost:${APP_PORT:-18081}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Consumes the Messenger queue like the production cron does (emails).
  worker:
    build:
      context: ./docker/php
      # www-data takes the host user's ids, so files written in the bind mount (vendor/, var/) stay the host's and
      # the mount is writable wherever the checkout is (a laptop, CI). The Makefile and the CI workflow set them.
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    user: www-data
    volumes:
      - ./backend:/var/www/backend
    environment:
      DATABASE_URL: "mysql://app:app@mysql:3306/app?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
      # Upload folders readable by the node service's tools (Prettier walks the project); production keeps 0750.
      UPLOAD_DIR_MODE: "0755"
      # Links in the emails point at this checkout's app.
      APP_URL: "http://localhost:${APP_PORT:-18081}"
    command: sh -c "while [ ! -f vendor/autoload.php ]; do sleep 5; done; exec php bin/console messenger:consume async --time-limit=3600 -vv"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  # Builds the React app into backend/public/build on every save (Webpack Encore); Symfony serves it.
  node:
    image: node:22-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      # Only uid 1000 ("node") has a home in this image; any other user would get / and no npm cache.
      HOME: /tmp
    # npm ci: the lock file is written by npm 11 (npm 10 crashes resolving this tree); ci only reads it.
    command: sh -c "npm ci --no-audit --no-fund && npm run watch"

  # The smoke suite (backend/e2e/smoke.sh): Playwright against this stack's app, only with `--profile e2e`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: [e2e]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      HOME: /tmp
      E2E_BASE_URL: "http://php"
    depends_on:
      - php

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-18025}:8025"

volumes:
  mysql_data:
