doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        # One mapping per bounded context: its Domain/Model folder.
        mappings:
            Document:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Document/Domain/Model'
                prefix: 'App\Document\Domain\Model'
            Finance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Finance/Domain/Model'
                prefix: 'App\Finance\Domain\Model'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
            Planning:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Planning/Domain/Model'
                prefix: 'App\Planning\Domain\Model'
            Project:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Project/Domain/Model'
                prefix: 'App\Project\Domain\Model'
            Settings:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Settings/Domain/Model'
                prefix: 'App\Settings\Domain\Model'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
