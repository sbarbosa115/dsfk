framework:
    messenger:
        failure_transport: failed

        transports:
            # Shared hosting has no workers: a cPanel cron runs messenger:consume every minute.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
