# Bounded contexts (symfony-react-app skill, steps/04 §4.1). Each context is split in two layers: its public
# face (<Context>Api: Application + Domain/Event) and its insides (<Context>: Domain, Infrastructure, UI). A
# context reaches another only through the other's public face. Shared is the kernel everyone may use.
# A context is added here when it is created.
deptrac:
  paths: [./src]
  exclude_files: ['#Kernel\.php$#']
  layers:
    - name: Shared
      collectors: [{ type: directory, value: src/Shared/.* }]
    - name: IdentityApi
      collectors: [{ type: directory, value: src/Identity/(Application|Domain/Event)/.* }]
    - name: Identity
      collectors:
        - type: bool
          must: [{ type: directory, value: src/Identity/.* }]
          must_not: [{ type: directory, value: src/Identity/(Application|Domain/Event)/.* }]
    - name: SettingsApi
      collectors: [{ type: directory, value: src/Settings/(Application|Domain/Event)/.* }]
    - name: Settings
      collectors:
        - type: bool
          must: [{ type: directory, value: src/Settings/.* }]
          must_not: [{ type: directory, value: src/Settings/(Application|Domain/Event)/.* }]
    - name: ProjectApi
      collectors: [{ type: directory, value: src/Project/(Application|Domain/Event)/.* }]
    - name: Project
      collectors:
        - type: bool
          must: [{ type: directory, value: src/Project/.* }]
          must_not: [{ type: directory, value: src/Project/(Application|Domain/Event)/.* }]
    - name: PlanningApi
      collectors: [{ type: directory, value: src/Planning/(Application|Domain/Event)/.* }]
    - name: Planning
      collectors:
        - type: bool
          must: [{ type: directory, value: src/Planning/.* }]
          must_not: [{ type: directory, value: src/Planning/(Application|Domain/Event)/.* }]
  ruleset:
    Shared: ~
    IdentityApi: [Shared, Identity]
    # Identity shows each user's project roles.
    Identity: [Shared, IdentityApi, ProjectApi]
    SettingsApi: [Shared, Settings]
    Settings: [Shared, SettingsApi]
    ProjectApi: [Shared, Project]
    # Members' names come from Identity, the default currency from Settings.
    Project: [Shared, ProjectApi, IdentityApi, SettingsApi]
    PlanningApi: [Shared, Planning]
    # The project's currency and activation come from Project, people's names from Identity.
    Planning: [Shared, PlanningApi, ProjectApi, IdentityApi]
