# The API's own validation messages (constraint "message:" options, InvalidValue::field), keyed by the English
# text they are written in. Symfony's standard messages come with the validator. A new message in PHP needs its
# line here, or the UI shows it in English.
"A category with this name already exists.": "Ya existe una categoría con ese nombre."
"Add at least one allocation.": "Agrega al menos una distribución."
"Choose the category.": "Elige la categoría."
"Choose the payment method.": "Elige el medio de pago."
"Choose the stage.": "Elige la etapa."
"Choose where the money goes.": "Elige el destino."
"Choose whether the expense is paid from the stage or from petty cash.": "Elige si el gasto se paga desde la etapa o desde la caja menor."
"Expense not found.": "Gasto no encontrado."
"File type not allowed. Use PDF, JPG, PNG, WEBP or HEIC.": "Formato no permitido. Usa PDF, JPG, PNG, WEBP o HEIC."
"Invalid amount for the project's currency.": "Monto inválido para la moneda del proyecto."
"Invalid category.": "Categoría inválida."
"Invalid percentage (2 decimals at most).": "Porcentaje inválido (máximo 2 decimales)."
"Invalid quantity (3 decimals at most).": "Cantidad inválida (máximo 3 decimales)."
"Invalid stage.": "Etapa inválida."
"Invalid status.": "Estado inválido."
"It must be a positive amount.": "Debe ser un monto positivo."
"Not enough funds. Available: %available%.": "Fondos insuficientes. Disponible: %available%."
"Only approved Team Lead expenses can be paid back.": "Solo se pueden reembolsar gastos aprobados de líderes de equipo."
"Only stage entries have a stage.": "Solo las etapas llevan etapa."
"Select a file.": "Selecciona un archivo."
"Select at least one expense.": "Selecciona al menos un gasto."
"Team Leads record expenses they paid with their own money.": "Los líderes de equipo registran gastos pagados con su dinero."
"The amount cannot be zero.": "El monto no puede ser cero."
"The amount is more than the contingency has available.": "El monto supera el saldo disponible de la contingencia."
"The category belongs to another project.": "La categoría no es de este proyecto."
"The category does not exist.": "La categoría no existe."
"The current password is not correct.": "La contraseña actual no es correcta."
"The date cannot be in the future.": "La fecha no puede estar en el futuro."
"The end date cannot be before the stage started.": "La fecha de fin no puede ser anterior al inicio de la etapa."
"The end date cannot be before the start date.": "La fecha de fin no puede ser anterior a la de inicio."
"The file could not be uploaded.": "No se pudo subir el archivo."
"The file is empty.": "El archivo está vacío."
"The file is larger than 10 MB.": "El archivo supera el máximo de 10 MB."
"The list must hold every stage of the project, each once.": "La lista debe contener todas las etapas del proyecto, una vez cada una."
"The new password must be different from the current one.": "La nueva contraseña debe ser diferente a la actual."
"The stage is already completed and holds no money.": "La etapa ya está finalizada y no tiene fondos."
"The stage is already completed.": "La etapa ya está finalizada."
"The stage's milestone weights cannot add up to more than 100 %.": "La suma de los pesos de la etapa no puede superar el 100 %."
"The weight must be between 0.01 % and 100 %.": "El peso debe estar entre 0,01 % y 100 %."
